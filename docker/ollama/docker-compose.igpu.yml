networks:
  net:  
    ipam:
      config:
        - subnet: 198.19.14.0/24
          gateway: 198.19.14.1

volumes:
  data:

services:
  ollama-igpu:
    container_name: ollama
    hostname: ollama
    image: ollama/ollama:latest
    volumes:
      - data:/root/.ollama
    environment:
      - TZ="Europe/Moscow"
      - OLLAMA_ORIGINS=*
      - OLLAMA_IGPU_ENABLE=1
      - OLLAMA_VULKAN=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    devices:
      - /dev/dri:/dev/dri
    ports:
      - 11434:11434
    networks:
      net:
        ipv4_address: 198.19.14.2
    healthcheck:
      test: ["CMD", "ollama", "ps"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3    
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "10"
    restart: unless-stopped