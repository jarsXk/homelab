- name: Проверка и подключение нового хоста
  hosts: all
  gather_facts: false
  connection: local

  tasks:
    - name: Получение SSH ключа хоста
      ansible.builtin.command:
        cmd: "ssh-keyscan -H {{ ansible_host | default(inventory_hostname) }}"
      register: ssh_keyscan
      changed_when: false

    - name: Добавление SSH ключа хоста в known_hosts
      ansible.builtin.known_hosts:
        path: "{{ lookup('env', 'HOME') }}/.ssh/known_hosts"
        name: "{{ ansible_host | default(inventory_hostname) }}"
        key: "{{ item }}"
        state: present
      loop: "{{ ssh_keyscan.stdout_lines }}"        